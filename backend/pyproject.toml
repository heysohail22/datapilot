[project]
name = "backend"
version = "0.1.0"
description = "DataPilot FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.6.0",
    "langchain-google-genai>=4.3.4",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.11",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "sqlglot>=30.24.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
